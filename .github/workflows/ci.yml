name: NoCodeML CI

on:
  push:
    branches:
      - main
      - release/v3-revival
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Lint
        run: npm run lint

      - name: Audit critical dependency vulnerabilities
        run: npm audit --audit-level=critical

  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite+aiosqlite:///./ci_nocodeml.db
      DB_SCHEMA: nocodeml
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile backend
        run: python -m compileall -q app

      - name: Validate Alembic history
        run: alembic history

      - name: Run smoke tests
        run: python -m pytest -q

  backend-container:
    name: Production container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --pull -t nocodeml-backend:ci Backend

      - name: Verify non-root runtime user
        run: |
          test "$(docker image inspect nocodeml-backend:ci --format '{{.Config.User}}')" = "nocodeml"

      - name: Smoke-test container liveness
        run: |
          docker run -d --rm --name nocodeml-ci -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:///./container_ci.db \
            -e CELERY_BROKER_URL=memory:// \
            -e CELERY_RESULT_BACKEND=cache+memory:// \
            -e SECRET_KEY=container-ci-secret-key-that-is-long-enough-123456789 \
            nocodeml-backend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/ready
          docker stop nocodeml-ci

  backend-arm64:
    name: ARM64 ML compatibility
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: Backend
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite+aiosqlite:///./ci_nocodeml_arm64.db
      DB_SCHEMA: nocodeml
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      SECRET_KEY: ci-only-arm64-secret-key-that-is-long-enough-123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install ML stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify native ARM64 libraries
        run: |
          python - <<'PY'
          import platform
          import lightgbm
          import numpy
          import pandas
          import sklearn
          import xgboost

          machine = platform.machine().lower()
          assert machine in {'aarch64', 'arm64'}, f'Expected ARM64 runner, got {machine}'
          print('architecture:', machine)
          print('numpy:', numpy.__version__)
          print('pandas:', pandas.__version__)
          print('scikit-learn:', sklearn.__version__)
          print('xgboost:', xgboost.__version__)
          print('lightgbm:', lightgbm.__version__)
          PY

      - name: Run real ML compatibility tests
        run: python -m pytest -q tests/test_ml_pipeline.py tests/test_run_config.py tests/test_eda_identity_detection.py

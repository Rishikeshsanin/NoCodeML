name: nocodeml-v3

services:
  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ARTIFACT_STORAGE_BACKEND: local
      DATASETS_DIR: /data/datasets
      MODELS_DIR: /data/models
      PREDICTIONS_DIR: /data/predictions
    expose:
      - "8000"
    volumes:
      - artifacts:/data
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 45s

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ARTIFACT_STORAGE_BACKEND: local
      DATASETS_DIR: /data/datasets
      MODELS_DIR: /data/models
      PREDICTIONS_DIR: /data/predictions
    volumes:
      - artifacts:/data
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  artifacts:
    name: nocodeml_v3_artifacts
  redis_data:
    name: nocodeml_v3_redis
  caddy_data:
    name: nocodeml_v3_caddy_data
  caddy_config:
    name: nocodeml_v3_caddy_config

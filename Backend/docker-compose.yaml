name: nocodeml

services:
  api:
    build: .
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
    tmpfs:
      - /tmp/nocodeml-sessions:mode=0700,uid=10001,gid=10001
      - /tmp/nocodeml-legacy:mode=0700,uid=10001,gid=10001
      - /tmp/nocodeml-artifacts:mode=0700,uid=10001,gid=10001
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      SESSION_ROOT_DIR: /tmp/nocodeml-sessions
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# No Postgres, Redis, Celery worker or persistent application volume is part of
# the V3 guest runtime. All visitor workspaces are short-lived filesystem data.

name: nocodeml

services:
  api:
    build: .
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - datasets:/app/datasets
      - models:/app/models
      - predictions:/app/predictions
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATASETS_DIR: /app/datasets
      MODELS_DIR: /app/models
      PREDICTIONS_DIR: /app/predictions
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    working_dir: /app
    volumes:
      - ./app:/app/app:ro
      - datasets:/app/datasets
      - models:/app/models
      - predictions:/app/predictions
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATASETS_DIR: /app/datasets
      MODELS_DIR: /app/models
      PREDICTIONS_DIR: /app/predictions
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  datasets:
  models:
  predictions:
